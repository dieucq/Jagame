; php.ini cho bản Windows của Ảnh Cưới (run_window.bat chạy php.exe -c php.ini). Khớp tham số -d
; trong run_mac.sh, docker/php.ini và synology/spk/target/php.ini.
extension_dir = "ext"

extension=pdo_sqlite
extension=sqlite3
extension=fileinfo
extension=gd
extension=mbstring
extension=exif
extension=zip
extension=openssl
extension=curl

date.timezone = Asia/Ho_Chi_Minh
upload_max_filesize = 64M
post_max_size = 70M
memory_limit = 768M
max_file_uploads = 50
max_input_vars = 5000
max_execution_time = 300
expose_php = Off
display_errors = Off
log_errors = On
